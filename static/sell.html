<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell Something - CampusRide</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🚲 CampusRide
    </div>

    <div class="nav-links">
        <a href="/">Marketplace</a>
        <a href="/seller.html">Seller Dashboard</a>
        <button onclick="logout()">Logout</button>
    </div>

</nav>


<main class="container">

    <div class="form-container">

        <h1>Sell Something</h1>

        <p>
            List your bike, scooty, cycle or other item
            for students on campus.
        </p>


        <form id="sellForm">

            <!-- ITEM NAME -->

            <label>Item Name</label>

            <input
                id="title"
                type="text"
                placeholder="Example: Hero Sprint Cycle"
                required
            >


            <!-- CATEGORY -->

            <label>Category</label>

            <select id="category" required>

                <option value="">
                    Select category
                </option>

                <option value="Bike">
                    🏍️ Bike
                </option>

                <option value="Scooty">
                    🛵 Scooty
                </option>

                <option value="Cycle">
                    🚲 Cycle
                </option>

                <option value="Other">
                    📦 Other
                </option>

            </select>


            <!-- PRICE -->

            <label>Price</label>

            <input
                id="price"
                type="number"
                min="1"
                placeholder="₹4500"
                required
            >


            <!-- PURCHASE DATE -->

            <label>When did you buy it?</label>

            <input
                id="purchase_date"
                type="date"
                required
            >


            <!-- CONDITION -->

            <label>Condition</label>

            <select id="condition" required>

                <option value="">
                    Select condition
                </option>

                <option value="Like New">
                    Like New
                </option>

                <option value="Good">
                    Good
                </option>

                <option value="Fair">
                    Fair
                </option>

            </select>


            <!-- HOSTEL -->

            <label>Hostel</label>

            <select id="hostel" required>

                <option value="">
                    Select your hostel
                </option>

                <optgroup label="Boys' Hostels">

                    <option>C.V. Raman Hostel</option>
                    <option>Sri Aurobindo Hostel</option>
                    <option>Ilango Adigal Hostel</option>
                    <option>Bharathidasan Hostel</option>
                    <option>Subramania Bharathi Hostel</option>
                    <option>Kamban Hostel</option>
                    <option>Tagore Hostel</option>
                    <option>SRK Hostel</option>
                    <option>Kalidas Hostel</option>
                    <option>Kannadasan Hostel</option>
                    <option>Kabirdas Hostel</option>
                    <option>MAKA Hostel</option>
                    <option>PG / Research Scholar Block</option>

                </optgroup>


                <optgroup label="Girls' Hostels">

                    <option>Madame Curie Hostel</option>
                    <option>Cauvery Hostel</option>
                    <option>Valmiki Hostel</option>
                    <option>Kalpana Chawla Hostel</option>
                    <option>Saraswathy Hostel</option>
                    <option>Yamuna Hostel</option>
                    <option>Ganga Hostel</option>
                    <option>Savithribai Phule Girls Hostel</option>

                </optgroup>

            </select>


            <!-- DESCRIPTION -->

            <label>Description</label>

            <textarea
                id="description"
                placeholder="Tell buyers about the item..."
                rows="5"
                required
            ></textarea>


            <!-- IMAGE -->

            <label>Item Photo</label>

            <input
                id="image"
                type="file"
                accept="image/jpeg,image/png,image/webp"
                required
            >

            <p>
                Upload a clear photo of your item.
                Maximum 5 MB.
            </p>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="primary-btn"
            >
                Publish Listing
            </button>

        </form>


        <p id="result"></p>

    </div>

</main>


<!-- ========================================= -->
<!-- AUTHENTICATION SCRIPT                     -->
<!-- IMPORTANT: auth.js comes FIRST            -->
<!-- ========================================= -->

<script src="/static/auth.js"></script>


<!-- ========================================= -->
<!-- SELL PAGE SCRIPT                          -->
<!-- ========================================= -->

<script>

const currentUser = requireLogin();


// --------------------------------
// Stop if user is not logged in
// --------------------------------

if (!currentUser) {

    throw new Error("User is not logged in.");

}


// --------------------------------
// Get logged-in user
// --------------------------------

const user = currentUser;


// --------------------------------
// Make sure user is a seller
// --------------------------------

if (user.role !== "seller") {

    alert("Only sellers can create listings.");

    window.location.href = "/";

}


// --------------------------------
// Submit listing
// --------------------------------

document
    .getElementById("sellForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        // --------------------------------
        // Create listing object
        // --------------------------------

        const listing = {

            title:
                document.getElementById("title").value,

            category:
                document.getElementById("category").value,

            price:
                Number(
                    document.getElementById("price").value
                ),

            purchase_date:
                document.getElementById("purchase_date").value,

            condition:
                document.getElementById("condition").value,

            hostel:
                document.getElementById("hostel").value,

            description:
                document.getElementById("description").value,

            whatsapp:
                user.whatsapp,

            seller_name:
                user.name,

            seller_student_id:
                user.student_id,

            image_url:
                ""

        };


        // --------------------------------
        // Send listing to backend
        // --------------------------------

        try {

            const response =
                await fetch("/listings", {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(listing)

                });


            const data =
                await response.json();


            // --------------------------------
            // Check response
            // --------------------------------

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Could not create listing"
                );

            }


            // --------------------------------
            // Success
            // --------------------------------

            document
                .getElementById("result")
                .innerHTML = `
                    <span style="color: green;">
                        ✅ Listing published successfully!
                    </span>
                `;


            // --------------------------------
            // Open listing page
            // --------------------------------

            setTimeout(() => {

                window.location.href =
                    `/listing.html?id=${data.listing_id}`;

            }, 1000);


        } catch (error) {

            console.error(error);


            document
                .getElementById("result")
                .innerHTML = `
                    <span style="color: red;">
                        ❌ ${error.message}
                    </span>
                `;

        }

    });

</script>


</body>

</html>
